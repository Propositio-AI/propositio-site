name: Deploy

# mainのCI成功後、GitHub Environment「prod」の承認ルールを通して本番配信する。
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            ref:
                description: デプロイするcommit SHA（空なら選択ブランチの先頭）
                required: false

permissions:
    contents: read
    id-token: write

concurrency:
    group: deploy-prod
    cancel-in-progress: false

jobs:
    deploy:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        name: Deploy static site (prod)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment:
            name: prod
            url: ${{ vars.WEB_URL }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - uses: astral-sh/setup-uv@v10.2.0
              with:
                  python-version: '3.12'
                  enable-cache: true
                  cache-dependency-glob: services/backend/uv.lock

            # 現在のFastAPIスキーマからTypeScriptクライアントを生成する。
            # 実AWSでは同じ契約をsite-api Lambdaが提供する。
            - name: Build web
              env:
                  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
                  VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
              run: |
                  (cd services/backend && uv sync --locked && uv run python -m app.export_openapi)
                  pnpm install --frozen-lockfile
                  pnpm generate:api
                  pnpm --filter web build

            # assetsはcontent hash付きなので長期キャッシュ。index.htmlは必ず再検証する。
            - name: Upload static site
              env:
                  WEB_BUCKET: ${{ vars.WEB_BUCKET }}
              run: |
                  aws s3 sync apps/web/dist/assets "s3://${WEB_BUCKET}/assets" \
                    --cache-control "public,max-age=31536000,immutable"
                  aws s3 sync apps/web/dist "s3://${WEB_BUCKET}" --delete \
                    --exclude "assets/*" --exclude "index.html" \
                    --cache-control "public,max-age=3600"
                  aws s3 cp apps/web/dist/index.html "s3://${WEB_BUCKET}/index.html" \
                    --cache-control "no-cache"
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/index.html" "/" \
                    --query 'Invalidation.Id' --output text
