services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
            POSTGRES_DB: ${POSTGRES_DB:-app}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app}']
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./backend
        env_file:
            - ./backend/.env
        environment:
            DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
        ports:
            - '8000:8000'
        volumes:
            - ./backend:/app
            - backend_venv:/app/.venv
        depends_on:
            db:
                condition: service_healthy
        command: >
            sh -c "uv run alembic upgrade head &&
                   uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    frontend:
        build:
            context: ./frontend
        env_file:
            - ./frontend/.env
        ports:
            - '5173:5173'
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            - backend

volumes:
    postgres_data:
    backend_venv:
    frontend_node_modules:
