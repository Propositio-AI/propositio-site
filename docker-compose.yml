# 通常開発用（PostgreSQL + FastAPI + Web）。起動: make up
# AWS互換開発（Floci + Terraform）は infra/floci/docker-compose.yml で別に起動する（make floci-up）。
services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
            POSTGRES_DB: ${POSTGRES_DB:-app}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app}']
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./services/backend
        env_file:
            - ./services/backend/.env
        environment:
            DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
        ports:
            - '8000:8000'
        volumes:
            - ./services/backend:/app
            - backend_venv:/app/.venv
        depends_on:
            db:
                condition: service_healthy
        command: >
            sh -c "uv run alembic upgrade head &&
                   uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    # Webフロントエンド（apps/web）。pnpm workspaceのため、リポジトリ全体をマウントし
    # node_modulesだけはコンテナ内のもの（Linux向けバイナリ）を使うようにボリュームで隠す。
    # モバイル（apps/mobile）はシミュレータ/実機と接続するためホスト上で起動する（make dev-mobile）。
    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        env_file:
            - ./apps/web/.env
        ports:
            - '5173:5173'
        volumes:
            - .:/workspace
            - web_root_node_modules:/workspace/node_modules
            - web_app_node_modules:/workspace/apps/web/node_modules
            - web_api_client_node_modules:/workspace/packages/api-client/node_modules
        depends_on:
            - backend

volumes:
    postgres_data:
    backend_venv:
    web_root_node_modules:
    web_app_node_modules:
    web_api_client_node_modules:
